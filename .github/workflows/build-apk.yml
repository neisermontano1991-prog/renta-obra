name: Build Android APK (TWA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-twa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (JDK + Android SDK paths)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade

      - name: Create self-signed keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=RentaObra, OU=RentaObra, O=RentaObra, L=CO, S=CO, C=CO"

      - name: Build APK
        run: bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "android"
          BUBBLEWRAP_KEY_PASSWORD: "android"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rentaobra-apk
          path: android-twa/*.apk
          if-no-files-found: error
          retention-days: 30