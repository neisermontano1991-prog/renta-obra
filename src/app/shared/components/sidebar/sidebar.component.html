<aside class="sidebar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    RentaObra
    <small style="font-size: var(--fs-xs); font-weight: var(--fw-regular); color: var(--muted); display: block; margin-top: 2px;">Alquiler de herramientas</small>
  </div>

  <nav class="nav">
    <a class="nav-item" routerLink="/panel" routerLinkActive="active"
       (click)="viewChange.emit('panel')"
       [ngClass]="{ active: currentView === 'panel' }">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Panel
    </a>

    <a class="nav-item" routerLink="/facturas" routerLinkActive="active"
       (click)="viewChange.emit('facturas')"
       [ngClass]="{ active: currentView === 'facturas' }">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      Facturas
    </a>

    <a class="nav-item" routerLink="/nueva-factura" routerLinkActive="active"
       (click)="viewChange.emit('nueva-factura')"
       [ngClass]="{ active: currentView === 'nueva-factura' }">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      Crear factura
    </a>

    <a class="nav-item" routerLink="/clientes" routerLinkActive="active"
       (click)="viewChange.emit('clientes')"
       [ngClass]="{ active: currentView === 'clientes' }">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
        <path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
      Clientes
    </a>

    <a class="nav-item" routerLink="/herramientas" routerLinkActive="active"
       (click)="viewChange.emit('herramientas')"
       [ngClass]="{ active: currentView === 'herramientas' }">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
      </svg>
      Herramientas
    </a>

    <a class="nav-item" routerLink="/gastos" routerLinkActive="active"
       (click)="viewChange.emit('gastos')"
       [ngClass]="{ active: currentView === 'gastos' }">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
      </svg>
      Gastos
    </a>

    <a class="nav-item" routerLink="/ajustes" routerLinkActive="active"
       (click)="viewChange.emit('ajustes')"
       [ngClass]="{ active: currentView === 'ajustes' }">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      Ajustes
    </a>
  </nav>

  <div class="side-user">
    <div class="avatar">{{ initials }}</div>
    <div>
      <div style="font-weight: var(--fw-semibold); color: var(--fg);">{{ displayName }}</div>
      <div style="font-size: var(--fs-xs);">{{ displaySub }}</div>
    </div>
  </div>

  <div class="side-user" style="border-top: 1px solid var(--border); padding-top: var(--space-3);">
    @if (demoMode()) {
      <button class="btn btn-sm btn-primary" style="width: 100%;" (click)="exitDemo()">Salir del modo demo</button>
    } @else {
      <button class="btn btn-sm btn-secondary" style="width: 100%;" (click)="logout()">Cerrar sesión</button>
    }
  </div>
</aside>
