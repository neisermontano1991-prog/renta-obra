<section class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px; color: var(--accent);">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <h1>RentaObra</h1>
      <p>{{ mode() === 'login' ? 'Inicia sesión para acceder' : 'Crea tu cuenta' }}</p>
    </div>

    <div class="login-form">
      <input
        type="email"
        placeholder="Correo electrónico"
        [value]="email()"
        (input)="onEmail($event)"
        autocomplete="email"
      />
      <input
        type="password"
        placeholder="Contraseña (mínimo 6 caracteres)"
        [value]="password()"
        (input)="onPassword($event)"
        [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
      />

      @if (error()) {
        <div class="login-error">{{ error() }}</div>
      }

      <button class="btn btn-primary btn-block" [disabled]="loading()" (click)="submit()">
        {{ loading() ? 'Procesando…' : (mode() === 'login' ? 'Ingresar' : 'Crear cuenta') }}
      </button>

      <div class="login-divider">o</div>

      <button class="btn btn-link btn-block" (click)="toggleMode()" [disabled]="loading()">
        {{ mode() === 'login'
          ? '¿No tienes cuenta? Regístrate aquí'
          : 'Ya tengo cuenta, ingresar' }}
      </button>

      <button class="btn btn-secondary btn-block" (click)="enterDemo()">
        Ver en modo demostración
      </button>
    </div>
  </div>
</section>
