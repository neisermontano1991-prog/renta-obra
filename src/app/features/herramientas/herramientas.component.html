<section class="view">
  <div class="page-head">
    <div>
      <h1>Herramientas</h1>
      <p class="sub">{{ toolCount() }} herramientas en catálogo</p>
    </div>
    <button class="btn btn-primary" (click)="toggleForm()">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Añadir herramienta
    </button>
  </div>

  <div class="card" *ngIf="showForm()" style="margin-bottom: var(--space-4);">
    <h4 style="margin-bottom: var(--space-4);">{{ editingTool() ? 'Editar' : 'Nueva' }} herramienta</h4>
    <div class="grid-form">
      <div class="field" style="grid-column: 1 / -1;">
        <label>Nombre</label>
        <input type="text" placeholder="Ej. Taladro percutor Bosch GSB 21" [value]="newTool().name" (input)="onFieldChange('name', $event)" />
      </div>
      <div class="field">
        <label>Tarifa por día ($)</label>
        <input type="number" min="0" step="0.01" [value]="newTool().priceDay" (input)="onFieldChange('priceDay', $event)" />
      </div>
      <div class="field">
        <label>Stock</label>
        <input type="number" min="1" [value]="newTool().stock" (input)="onFieldChange('stock', $event)" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" (click)="saveTool()">{{ editingTool() ? 'Actualizar' : 'Guardar' }} herramienta</button>
      <button class="btn btn-secondary" (click)="toggleForm()">Cancelar</button>
    </div>
  </div>

  <div class="card herramientas-card">
    <div class="tool-row" *ngFor="let t of toolData()">
      <div class="tool-info">
        <span class="tool-name">{{ t.name }}</span>
        <span class="tool-meta">{{ t.priceDay | currencyFormat }}/día · Stock: {{ t.stock }}</span>
      </div>
      <div class="tool-actions">
        <span class="pill-stock" [class.pill-stock-active]="t.activeRentals > 0">{{ t.activeRentals }} en alquiler</span>
        <button class="btn btn-sm btn-secondary" (click)="startEdit(t)">Editar</button>
        <button class="btn btn-sm btn-secondary" style="color: var(--danger);" (click)="removeTool(t.id ?? '')">Quitar</button>
      </div>
    </div>
    <div *ngIf="toolData().length === 0" class="empty-state">
      No hay herramientas registradas
    </div>
  </div>
</section>
